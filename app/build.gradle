import java.util.Base64

plugins {
    id 'com.android.application'
}

// Development builds intentionally share one non-secret signing key so APKs
// produced locally and by CI can update one another. Never use this key for a
// production/release build.
def developmentKeyBase64 = file('openroadcode-debug.keystore.b64')
def developmentKey = layout.buildDirectory.file('signing/openroadcode-debug.keystore').get().asFile

developmentKey.parentFile.mkdirs()
developmentKey.bytes = Base64.mimeDecoder.decode(developmentKeyBase64.text)

def gitSha = System.getenv('GITHUB_SHA')
if (!gitSha) {
    try {
        gitSha = ['git', 'rev-parse', 'HEAD'].execute(null, rootDir).text.trim()
    } catch (Exception ignored) {
        gitSha = 'unknown'
    }
}
def shortGitSha = gitSha ? gitSha.take(7) : 'unknown'

android {
    namespace 'org.openroadcode.androidbridge'
    compileSdk 34

    defaultConfig {
        applicationId 'org.openroadcode.androidbridge'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.5.0'
        buildConfigField 'String', 'GIT_SHA', '"' + shortGitSha + '"'
    }

    signingConfigs {
        debug {
            storeFile developmentKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
