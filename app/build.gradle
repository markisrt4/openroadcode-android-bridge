import java.util.Base64

plugins {
    id 'com.android.application'
}

// Development builds intentionally share one non-secret signing key so APKs
// produced locally and by CI can update one another. Never use this key for a
// production/release build.
def developmentKeyBase64 = file('openroadcode-debug.keystore.b64')
def developmentKey = layout.buildDirectory.file('signing/openroadcode-debug.keystore').get().asFile

developmentKey.parentFile.mkdirs()
developmentKey.bytes = Base64.mimeDecoder.decode(developmentKeyBase64.text)

def gitSha = System.getenv('GITHUB_SHA')
if (!gitSha) {
    try {
        gitSha = ['git', 'rev-parse', 'HEAD'].execute(null, rootDir).text.trim()
    } catch (Exception ignored) {
        gitSha = 'unknown'
    }
}
def shortGitSha = gitSha ? gitSha.take(7) : 'unknown'
def baseVersion = '1.0.0-rc.6'
def isTagBuild = System.getenv('GITHUB_REF_TYPE') == 'tag'

// Private release credentials are supplied by the protected CI environment.
def releaseValues = ['ORC_RELEASE_KEYSTORE', 'ORC_RELEASE_STORE_PASSWORD',
                     'ORC_RELEASE_KEY_ALIAS', 'ORC_RELEASE_KEY_PASSWORD']
        .collectEntries { [(it): System.getenv(it)] }
def hasReleaseSigning = releaseValues.values().every { it != null && !it.isBlank() }
if (releaseValues.values().any { it != null && !it.isBlank() } && !hasReleaseSigning) {
    throw new GradleException('Incomplete ORC release signing configuration')
}


android {
    namespace 'org.openroadcode.androidbridge'
    compileSdk 34

    defaultConfig {
        applicationId 'org.openroadcode.androidbridge'
        minSdk 26
        targetSdk 34
        versionCode 39
        versionName isTagBuild ? baseVersion : "${baseVersion}+${shortGitSha}"
        buildConfigField 'String', 'GIT_SHA', '"' + shortGitSha + '"'
        buildConfigField 'String', 'BASE_VERSION', '"' + baseVersion + '"'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseValues.ORC_RELEASE_KEYSTORE)
                storePassword releaseValues.ORC_RELEASE_STORE_PASSWORD
                keyAlias releaseValues.ORC_RELEASE_KEY_ALIAS
                keyPassword releaseValues.ORC_RELEASE_KEY_PASSWORD
            }
        }
        debug {
            storeFile developmentKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            debuggable false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
