name: Build Android APK

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build debug APK
        run: gradle --no-daemon testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          GRADLE_FILE="app/build.gradle"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT"

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"
          BASE_VERSION="$(sed -nE "s/^[[:space:]]*def baseVersion = '([^']+)'.*/\1/p" "$GRADLE_FILE" | head -n 1)"
          MIN_SDK="$(sed -nE 's/^[[:space:]]*minSdk[[:space:]]+([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"
          TARGET_SDK="$(sed -nE 's/^[[:space:]]*targetSdk[[:space:]]+([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"

          test -n "$VERSION_CODE"
          test -n "$BASE_VERSION"
          test -n "$MIN_SDK"
          test -n "$TARGET_SDK"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION_NAME="$BASE_VERSION"
          else
            VERSION_NAME="${BASE_VERSION}+${GITHUB_SHA:0:7}"
          fi

          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='org.openroadcode.androidbridge' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" <<<"$BADGING"
          grep -q "sdkVersion:'${MIN_SDK}'" <<<"$BADGING"
          grep -q "targetSdkVersion:'${TARGET_SDK}'" <<<"$BADGING"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            EXPECTED_TAG="v${BASE_VERSION}"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
              echo "Release tag '$GITHUB_REF_NAME' does not match Gradle version '$BASE_VERSION' (expected '$EXPECTED_TAG')." >&2
              exit 1
            fi
          fi

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openroadcode-android-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Collect APK review evidence
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          export PATH="$TOOLS:$PATH"
          bash development/release/apk_evidence.sh app/build/outputs/apk/debug/app-debug.apk apk-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: openroadcode-apk-review-evidence
          path: apk-evidence/
          if-no-files-found: error
