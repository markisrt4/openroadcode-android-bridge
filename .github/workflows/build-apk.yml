name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          GRADLE_FILE="app/build.gradle"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT"

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" "$GRADLE_FILE" | head -n 1)"
          MIN_SDK="$(sed -nE 's/^[[:space:]]*minSdk[[:space:]]+([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"
          TARGET_SDK="$(sed -nE 's/^[[:space:]]*targetSdk[[:space:]]+([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"

          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test -n "$MIN_SDK"
          test -n "$TARGET_SDK"

          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='org.openroadcode.androidbridge' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" <<<"$BADGING"
          grep -q "sdkVersion:'${MIN_SDK}'" <<<"$BADGING"
          grep -q "targetSdkVersion:'${TARGET_SDK}'" <<<"$BADGING"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            EXPECTED_TAG="v${VERSION_NAME}"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
              echo "Release tag '$GITHUB_REF_NAME' does not match Gradle version '$VERSION_NAME' (expected '$EXPECTED_TAG')." >&2
              exit 1
            fi
          fi

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openroadcode-android-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/openroadcode-android-bridge-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/openroadcode-android-bridge-${GITHUB_REF_NAME}.apk" \
            --title "OpenRoadCode Android Bridge ${GITHUB_REF_NAME}" \
            --generate-notes
