name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$($AAPT dump badging "$APK")"
          printf '%s\n' "$BADGING"
          grep -q "package: name='org.openroadcode.androidbridge' versionCode='2' versionName='0.2.0'" <<<"$BADGING"
          grep -q "sdkVersion:'26'" <<<"$BADGING"
          grep -q "targetSdkVersion:'34'" <<<"$BADGING"

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openroadcode-android-bridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
